<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИсторияБел — подготовка к ЦЭ/ЦТ по истории Беларуси</title>
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #101527;
  --panel: #161d33;
  --panel2: #1c2440;
  --border: #27325a;
  --text: #e8ecf8;
  --muted: #8e9ac0;
  --accent: #5b8cff;
  --accent2: #8b5cf6;
  --ok: #34d399;
  --bad: #f87171;
  --warn: #fbbf24;
  --grad: linear-gradient(135deg, #5b8cff, #8b5cf6);
  --grad2: linear-gradient(135deg, #8b5cf6, #ec4899);
  --glow: 0 0 24px rgba(91, 140, 255, 0.18);
}
[data-theme="light"] {
  --bg: #f0f2f5;
  --bg2: #ffffff;
  --panel: #ffffff;
  --panel2: #f8f9fc;
  --border: #d1d5db;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #3b82f6;
  --accent2: #7c3aed;
  --ok: #059669;
  --bad: #dc2626;
  --warn: #d97706;
  --grad: linear-gradient(135deg, #3b82f6, #7c3aed);
  --grad2: linear-gradient(135deg, #7c3aed, #db2777);
  --glow: 0 4px 20px rgba(0, 0, 0, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  background: radial-gradient(1200px 800px at 85% -10%, rgba(139, 92, 246, 0.14), transparent 55%),
              radial-gradient(1000px 700px at -10% 20%, rgba(91, 140, 255, 0.12), transparent 55%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  transition: background 0.4s ease, color 0.3s ease;
}
[data-theme="light"] body {
  background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 50%, #fff0f5 100%);
}
header {
  background: rgba(10, 14, 26, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
  transition: background 0.4s ease, border-color 0.3s ease;
}
[data-theme="light"] header {
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.header-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; gap: 12px; flex-wrap: wrap; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: 0.3px; background: linear-gradient(90deg, #7aa5ff, #a78bfa, #e879f9); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
.logo span { font-size: 12px; color: var(--muted); -webkit-text-fill-color: var(--muted); font-weight: 500; margin-left: 8px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button {
  background: transparent;
  border: 1px solid transparent;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.18s;
}
nav button:hover { color: var(--text); background: var(--panel); }
nav button.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(91, 140, 255, 0.22), rgba(139, 92, 246, 0.22));
  border-color: rgba(122, 165, 255, 0.45);
  border-bottom-color: #7aa5ff;
  box-shadow: 0 0 18px rgba(91, 140, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.theme-toggle {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  transition: all 0.18s;
  color: var(--text);
}
.theme-toggle:hover { background: var(--panel); transform: rotate(15deg) scale(1.1); }
main { padding: 28px 0 60px; }
h1 { font-size: 27px; margin-bottom: 6px; letter-spacing: 0.2px; }
h2 { font-size: 19px; margin-bottom: 14px; font-weight: 700; }
.sub { color: var(--muted); margin-bottom: 22px; font-size: 15px; }
.card {
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 16px;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  position: relative;
  animation: slideUp 0.45s ease both;
}
.card:hover { box-shadow: var(--glow); transform: translateY(-3px); }
.card.theory-card { padding: 36px 44px; animation: fadeIn 0.5s ease both; }
.grid { display: grid; gap: 14px; }
.grid.cols2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.cols3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--grad);
  color: #fff; border: none; padding: 12px 22px;
  border-radius: 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.18s;
  box-shadow: 0 4px 16px rgba(91, 140, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(91, 140, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2); filter: brightness(1.06); }
.btn:active { transform: translateY(0); }
.btn.ghost { background: var(--panel); border: 1px solid var(--border); color: var(--text); box-shadow: none; }
.btn.ghost:hover { border-color: var(--accent); background: var(--panel2); box-shadow: 0 0 16px rgba(91, 140, 255, 0.15); }
.btn.danger { background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3); }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--panel); border: 1px solid var(--border);
  padding: 9px 15px; border-radius: 999px; cursor: pointer;
  font-size: 13.5px; color: var(--muted); transition: all 0.15s; font-weight: 500;
}
.chip:hover { color: var(--text); border-color: var(--accent); }
.chip.on { background: linear-gradient(135deg, rgba(91, 140, 255, 0.28), rgba(139, 92, 246, 0.28)); color: #fff; border-color: var(--accent); box-shadow: 0 0 14px rgba(91, 140, 255, 0.25); }
.opt {
  display: block; width: 100%; text-align: left;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); padding: 13px 16px; border-radius: 12px;
  margin-bottom: 10px; cursor: pointer; font-size: 15px;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
.opt:disabled { cursor: default; opacity: 0.95; }
.opt.correct { border-color: var(--ok); background: rgba(52, 211, 153, 0.14); }
.opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, 0.14); }
.opt .letter { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; background: var(--border); border-radius: 8px; margin-right: 12px; font-weight: 700; font-size: 13px; }
.opt.correct .letter { background: var(--ok); color: #06281c; }
.opt.wrong .letter { background: var(--bad); color: #2b0a0a; }
.explain { border-left: 3px solid var(--accent); background: rgba(91, 140, 255, 0.08); padding: 14px 16px; border-radius: 0 12px 12px 0; margin: 14px 0; font-size: 14.5px; }
.explain.bad { border-color: var(--bad); background: rgba(248, 113, 113, 0.08); }
.explain.ok { border-color: var(--ok); background: rgba(52, 211, 153, 0.08); }
.progress { height: 8px; background: var(--bg2); border-radius: 999px; overflow: hidden; margin: 10px 0; position: relative; }
.progress > div { height: 100%; background: var(--grad); border-radius: 999px; transition: width 0.3s; position: relative; overflow: hidden; }
.progress > div::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  transform: translateX(-100%);
  animation: shimmer 2.2s infinite;
}
@keyframes shimmer { 100% { transform: translateX(100%); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.92); } 70% { transform: scale(1.02); } 100% { opacity: 1; transform: scale(1); } }
.statbox { text-align: center; padding: 18px 10px; }
.statbox .num { font-size: 30px; font-weight: 800; background: linear-gradient(90deg, #7aa5ff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.statbox .lbl { color: var(--muted); font-size: 13px; margin-top: 4px; }
.tag { display: inline-block; font-size: 12px; color: var(--muted); background: var(--bg2); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; border: 1px solid var(--border); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.qtext { font-size: 17.5px; font-weight: 600; margin-bottom: 18px; line-height: 1.5; }
.footer-note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 26px; }
.streak { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13.5px; box-shadow: 0 0 16px rgba(245, 158, 11, 0.4); animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.82; } }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.big-date { font-size: 46px; font-weight: 800; background: linear-gradient(90deg, #7aa5ff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mode-badge { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; margin-right: 6px; border: 1px solid transparent; }
.mode-learn { background: rgba(91, 140, 255, 0.18); color: #9db9ff; border-color: rgba(91, 140, 255, 0.45); }
.mode-quiz { background: rgba(139, 92, 246, 0.18); color: #c4a8ff; border-color: rgba(139, 92, 246, 0.45); }
.mode-exam { background: rgba(248, 113, 113, 0.18); color: #ffb0b0; border-color: rgba(248, 113, 113, 0.45); }
select, input[type=number] {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none;
}
select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.18); }
.result-ring { font-size: 56px; font-weight: 800; text-align: center; }

/* ===== Компоненты интерфейса (классы из разметки) ===== */
.muted { color: var(--muted); }

/* Варианты ответа */
.option {
  display: flex; align-items: center; width: 100%; text-align: left;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); padding: 14px 16px; border-radius: 12px;
  margin-bottom: 10px; cursor: pointer; font-size: 15.5px; font-family: inherit;
  transition: border-color 0.15s, background 0.15s, transform 0.12s;
}
.option:hover:not(.disabled) { border-color: var(--accent); transform: translateX(4px); }
.option.disabled { cursor: default; }
.option.selected { border-color: var(--accent); background: rgba(91, 140, 255, 0.14); }
.option.correct { border-color: var(--ok); background: rgba(52, 211, 153, 0.14); animation: popIn 0.35s ease; }
.option.wrong { border-color: var(--bad); background: rgba(248, 113, 113, 0.14); animation: shake 0.4s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.option-letter {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 28px; height: 28px; border-radius: 8px; margin-right: 12px;
  background: var(--border); font-weight: 700; font-size: 13px; color: var(--text);
}
.option.selected .option-letter { background: var(--accent); color: #fff; }
.option.correct .option-letter { background: var(--ok); color: #06281c; }
.option.wrong .option-letter { background: var(--bad); color: #2b0a0a; }

/* Сопоставление */
.match-row {
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
}
.match-row.ok { border-color: var(--ok); background: rgba(52, 211, 153, 0.1); }
.match-row.bad { border-color: var(--bad); background: rgba(248, 113, 113, 0.1); }
.match-left { flex: 1; font-size: 15px; }
.match-row select { flex: 0 0 46%; }

/* Упорядочивание */
.order-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
}
.order-row.ok { border-color: var(--ok); background: rgba(52, 211, 153, 0.1); }
.order-row.bad { border-color: var(--bad); background: rgba(248, 113, 113, 0.1); }
.order-text { flex: 1; font-size: 15px; }
.order-btn {
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 15px;
  transition: all 0.15s;
}
.order-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--panel2); }
.order-btn:disabled { opacity: 0.35; cursor: default; }

/* Кнопки-модификаторы */
.btn-outline {
  background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none;
}
.btn-outline:hover:not(:disabled) { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 16px rgba(91, 140, 255, 0.15); }
.btn-green { background: linear-gradient(135deg, #10b981, #34d399); box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35); }
.btn-amber { background: linear-gradient(135deg, #f59e0b, #f97316); box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* Прочие кнопки с .btn */
.btn { font-family: inherit; }

/* Метрики */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 18px 0; }
.stat {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 12px; text-align: center; animation: popIn 0.5s ease both;
}
.stat:nth-child(2) { animation-delay: 0.06s; }
.stat:nth-child(3) { animation-delay: 0.12s; }
.stat:nth-child(4) { animation-delay: 0.18s; }
.stat-val { font-size: 28px; font-weight: 800; background: linear-gradient(90deg, #7aa5ff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat-label { color: var(--muted); font-size: 12.5px; margin-top: 4px; }

/* Карточки тем */
.topic-card {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
}
.topic-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--grad); transform: scaleY(0); transform-origin: top; transition: transform 0.25s;
}
.topic-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(91, 140, 255, 0.18); }
.topic-card:hover::before { transform: scaleY(1); }
.topic-card h3 { font-size: 16.5px; margin-bottom: 8px; }
.topic-card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
.badge {
  display: inline-block; margin-top: 12px; font-size: 12px; color: var(--muted);
  background: var(--bg2); border: 1px solid var(--border); padding: 4px 11px; border-radius: 999px;
}

/* Навигация назад */
.back-link {
  display: inline-block; color: var(--muted); font-size: 14px; cursor: pointer;
  margin-bottom: 14px; transition: color 0.15s, transform 0.15s;
}
.back-link:hover { color: var(--accent); transform: translateX(-3px); }

/* Подсказки */
.tip-box {
  background: linear-gradient(135deg, rgba(91, 140, 255, 0.1), rgba(139, 92, 246, 0.08));
  border: 1px solid rgba(91, 140, 255, 0.35); border-radius: 12px;
  padding: 15px 18px; margin-top: 18px; font-size: 14.5px; line-height: 1.6;
}

/* Прогресс практики */
.progress-bar { height: 8px; background: var(--bg2); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; border: 1px solid var(--border); }
.progress-fill { height: 100%; background: var(--grad); border-radius: 999px; transition: width 0.35s ease; }
.question-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 10px; flex-wrap: wrap; }
.explanation {
  border-left: 3px solid var(--accent); background: rgba(91, 140, 255, 0.08);
  padding: 14px 16px; border-radius: 0 12px 12px 0; margin: 16px 0; font-size: 14.5px; line-height: 1.6;
  animation: slideDown 0.3s ease;
}

/* Разбор ответов */
.result-item { border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--border); background: var(--panel2); border-left-width: 4px; }
.result-item.ok { border-left-color: var(--ok); }
.result-item.bad { border-left-color: var(--bad); }
.result-item b { color: var(--text); }

/* Таймер */
.timer {
  display: inline-block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
  padding: 8px 18px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border);
  transition: all 0.3s;
}
.timer.warn { color: var(--warn); border-color: var(--warn); background: rgba(251, 191, 36, 0.12); }
.timer.danger { color: var(--bad); border-color: var(--bad); background: rgba(248, 113, 113, 0.14); animation: pulse 1s infinite; }

/* Навигатор вопросов */
.q-navigator { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; background: var(--bg2); border-radius: 12px; border: 1px solid var(--border); }
.q-nav-btn {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--muted); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; font-family: inherit;
}
.q-nav-btn:hover { border-color: var(--accent); color: var(--text); }
.q-nav-btn.answered { background: rgba(52, 211, 153, 0.18); border-color: var(--ok); color: var(--ok); }
.q-nav-btn.current { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(91, 140, 255, 0.45); }

/* Флеш-карточка (даты) */
.flashcard {
  min-height: 190px; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 30px; margin: 18px 0; border-radius: 18px; cursor: pointer;
  background: linear-gradient(160deg, #1a2340, #232c52);
  border: 1px solid var(--border); font-size: 26px; font-weight: 800; color: #9db9ff;
  user-select: none; transition: transform 0.25s, box-shadow 0.25s;
  animation: popIn 0.35s ease;
}
.flashcard:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 14px 40px rgba(91, 140, 255, 0.25); }
.flashcard.back { background: linear-gradient(160deg, #14324a, #164a3d); color: #a7f3d0; font-size: 18px; font-weight: 600; }

/* Заголовки секций и пустые состояния */
.section-title { font-size: 16px; font-weight: 700; margin: 26px 0 12px; color: #cdd9ff; }
.empty { color: var(--muted); padding: 24px; text-align: center; font-size: 14.5px; }

/* Таблицы вне теории (прогресс) */
.card table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
.card table th, .card table td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; }
.card table th { background: rgba(91, 140, 255, 0.12); color: #cdd9ff; font-weight: 700; }

/* Светлая тема: правки контраста */
[data-theme="light"] .theory-content b, [data-theme="light"] .theory-content strong { color: #1e293b; }
[data-theme="light"] .theory-content h3 { color: #1e40af; }
[data-theme="light"] .theory-content th { color: #1e40af; }
[data-theme="light"] .section-title { color: #1e40af; }
[data-theme="light"] .card table th { color: #1e40af; }
[data-theme="light"] .flashcard { background: linear-gradient(160deg, #dbeafe, #ede9fe); color: #1e40af; }
[data-theme="light"] .flashcard.back { background: linear-gradient(160deg, #d1fae5, #ccfbf1); color: #065f46; }
[data-theme="light"] .tip-box { background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(124,58,237,0.06)); }
[data-theme="light"] .opt, [data-theme="light"] .option { background: #fff; }

/* --- Теория: типографика контента --- */
.theory-content { font-size: 16px; line-height: 1.95; color: var(--text); max-width: 860px; }
.theory-content h3 {
  font-size: 18.5px; font-weight: 700; margin: 32px 0 16px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
  color: #cdd9ff; letter-spacing: 0.2px;
}
.theory-content h3:first-child { margin-top: 6px; }

  {id:"rt1", topic:"ancient", part:"А", type:"single",
   q:"В первобытном обществе на белорусских землях занятием производящего хозяйства являлось(-ось):",
   o:["Охота","Рыболовство","Собирательство","Животноводство"], c:3,
   e:`Производящее хозяйство — это земледелие и животноводство. Охота, рыболовство, собирательство и добыча кремня относятся к присваивающему хозяйству.`},
  {id:"rt2", topic:"polotsk", part:"А", type:"single",
   q:"Киевский князь Мстислав совместно с семью князьями совершил поход в Полоцкую землю в:",
   o:["998 г.","1067 г.","1101 г.","1127 г."], c:3,
   e:`В 1127 г. киевский князь Мстислав Великий организовал поход коалиции русских князей в Полоцкую землю; в 1129 г. полоцкие князья были высланы в Византию. 1067 — битва на Немиге; 1101 — смерть Всеслава.`},
  {id:"rt3", topic:"vkl", part:"А", type:"single",
   q:"В 1398 г. Салинское соглашение с Тевтонским орденом заключил великий князь литовский:",
   o:["Витовт","Ольгерд","Ягайло","Гедимин"], c:0,
   e:`Салинское соглашение с Тевтонским орденом (1398) заключил Витовт; вскоре последовала битва на Ворскле (1399).`},
  {id:"rt4", topic:"vkl", part:"А", type:"single",
   q:"Определите характерную черту развития культуры белорусских земель во второй половине XIII–XIV в.:",
   o:["Распространение ренессансной культуры","Развитие иконописи","Распространение идей Просвещения","Появление книгопечатания"], c:1,
   e:`Во второй половине XIII–XIV в. развивалась иконопись. Ренессанс — XV–XVI вв.; идеи Просвещения — XVIII в.; книгопечатание — с 1517 г. (Ф. Скорина).`},
  {id:"rt5", topic:"rp", part:"А", type:"single",
   q:"Во второй половине XVII — первой половине XVIII в. в крестьянской и мещанской среде большой популярностью пользовались:",
   o:["Библиотеки","Крепостные театры","Батлейки","Периодические издания"], c:2,
   e:`Батлейка — народный кукольный театр, популярный в крестьянской и мещанской среде. Крепостные театры существовали при магнатских дворах.`},
  {id:"rt6", topic:"vkl", part:"А", type:"single",
   q:"Фрагмент документа: «Отдельное избрание и возведение на княжение великого князя литовского... должно быть отменено... Отныне король не будет созывать никаких других отдельных сеймов для чинов Короны и Литвы, но всегда только общий сейм...». О каком событии идёт речь?",
   o:["Заключение Кревской унии","Заключение Виленско-Радомской унии","Заключение Люблинской унии","Заключение Городельской унии"], c:2,
   e:`Это Люблинская уния 1569 г. — ликвидировала отдельное княжение в ВКЛ и создала общий сейм, образовав Речь Посполитую.`},
  {id:"rt7", topic:"ri", part:"А", type:"single",
   q:"На белорусских землях в составе Российской империи в конце XVIII — начале XIX в. царское правительство:",
   o:["Проводило «разбор» шляхты","Отменило Статут ВКЛ 1588 г.","Ввело магдебургское право","Отменило крепостное право"], c:0,
   e:`В конце XVIII — начале XIX в. проводился «разбор шляхты» — проверка документов о дворянстве. Статут ВКЛ отменён в 1840 г.; магдебургское право отменялось, а не вводилось; крепостное право отменено в 1861 г.`},
  {id:"rt8", topic:"ri", part:"А", type:"single",
   q:"Социально-экономическое развитие белорусских земель в первой половине XIX в. характеризовалось:",
   o:["Разрушением сельской (крестьянской) общины","Появлением фабричного производства","Завершением промышленного переворота","Появлением мануфактурного производства"], c:3,
   e:`В первой половине XIX в. появляются мануфактуры. Фабрики и промышленный переворот — вторая половина XIX в.; разрушение общины и рынок свободной рабочей силы — после отмены крепостного права (1861).`},
  {id:"rt9", topic:"ri", part:"А", type:"single",
   q:"Композитор, пианист, художник второй половины XIX в., выполнивший около 1000 зарисовок мест, связанных с жизнью известных людей и архитектурных памятников Беларуси, — это:",
   o:["И. Носович","Н. Орда","И. Буйницкий","В. Ластовский"], c:1,
   e:`Наполеон Орда — композитор, пианист и художник, автор около 1000 зарисовок архитектурных памятников Беларуси.`},
  {id:"rt10", topic:"ri", part:"А", type:"single",
   q:"В период первой российской буржуазно-демократической революции 1905–1907 гг. за свержение самодержавия путём революции выступала партия:",
   o:["Октябристов","Кадетов","Большевиков","Русский окраинный союз (РОС)"], c:2,
   e:`За свержение самодержавия путём революции выступали большевики. Октябристы и кадеты были за реформы и сохранение монархии.`},
  {id:"rt11", topic:"bnr", part:"А", type:"single",
   q:"В Минске 5–18 декабря 1917 г.:",
   o:["Прошёл I Всебелорусский съезд","Создана Социалистическая Советская Республика Беларуси (ССРБ)","Создана ССР Литвы и Беларуси (Литбел)","Образован СССР"], c:0,
   e:`5–18 декабря 1917 г. в Минске прошёл I Всебелорусский съезд. ССРБ создана 1 января 1919 г.; Литбел — в феврале 1919 г.; СССР — 30 декабря 1922 г.`},
  {id:"rt12", topic:"vov", part:"А", type:"single",
   q:"Определите особенность развития партизанского движения на оккупированной территории БССР в 1943 г.:",

   e:`В 1943 г. массово создавались партизанские зоны (к концу года — более 20, около 60% территории). ЦШПД создан в 1942 г., БШПД — в сентябре 1942 г., первые отряды — в 1941 г.`},

  {id:"rt15", topic:"modern", part:"А", type:"single",

  {id:"rt17", topic:"rp", part:"А", type:"single",

  {id:"rt18", topic:"ri", part:"А", type:"single",
   q:"Способ аграрного хозяйствования, при котором право собственности на землю закрепляется за теми, кто её непосредственно обрабатывает, — это «____» путь развития капитализма в сельском хозяйстве:",
   o:["Американский (фермерский)","Прусский","Отработочный","Экстенсивный"], c:0,

  {id:"rt19", topic:"ri", part:"Б", type:"order",

   c:[1,0,3,2],
   e:`1840 — отмена Статута ВКЛ; 1906 — начало столыпинской реформы; 1917 — Октябрьская революция; 1929 — начало коллективизации в БССР.`},
  {id:"rt20", topic:"ancient", part:"Б", type:"match",

   right:["1) община","2) бортничество","3) земледелие и животноводство","4) охота и рыболовство","5) шорное ремесло","6) отдельные семьи"],
   c:[0,2,1],
   e:`Земля принадлежала общине; главные занятия — земледелие и животноводство; сбор мёда диких пчёл — бортничество.`},
  {id:"rt21", topic:"vkl", part:"Б", type:"match",
   q:"Вставьте пропущенные слова (белорусские земли в XIV–XV вв.):",

   right:["1) родоплеменные","2) феодальные","3) сословия","4) парафин","5) закреплялись законом","6) не передавались по наследству"],

   e:`В XIV–XV вв. господствовали феодальные отношения; общество делилось на сословия — группы с правами и обязанностями, которые закреплялись законом.`},
  {id:"rt22", topic:"vkl", part:"Б", type:"match",
   q:"Вставьте пропущенные слова (аграрная реформа в ВКЛ в середине XVI в.):",
   left:["А) Реформа привела к ... сельского хозяйства","Б) Налоги стали взиматься с","В) Закрепление крестьян за наделами свидетельствовало об"],
   right:["1) повышение прибыльности","2) упадок","3) волока","4) община","5) усиление закрепощения","6) ослабление закрепощения"],
   c:[0,2,4],
   e:`«Устава на волоки» (1557) повысила прибыльность хозяйства; налоги взимались с волоки, а не с дыма; закрепление крестьян за наделами усиливало закрепощение.`},
  {id:"rt23", topic:"ri", part:"Б", type:"match",
   q:"Вставьте пропущенные слова (рабочее движение в конце XIX в.):",
   left:["А) Переход рабочих к ... требованиям","Б) ... движения привело к образованию политических партий","В) В 1898 г. на съезде в Минске было провозглашено создание"],
   right:["1) от экономических к политическим","2) от политических к экономическим","3) РСДРП","4) ПСР","5) упадок крестьянского","6) нарастание рабочего"],
   c:[0,5,2],
   e:`Рабочие переходили от экономических требований к политическим; нарастание рабочего движения привело к созданию партий; в 1898 г. в Минске провозглашено создание РСДРП.`},
  {id:"rt24", topic:"ancient", part:"Б", type:"multi",
   q:"Определите три правильных утверждения относительно славянских союзов племён на белорусских землях в Раннем средневековье:",
   o:["Древнейшим городом дреговичей был Туров","Кривичи селились в среднем течении р. Припять","Самым крупным славянским союзом племён были кривичи","Древнейшим городом радимичей был Менск (Минск)","Для каждого союза племён был характерен свой тип женских украшений"], c:[0,2,4],
   e:`Верно: Туров — древнейший город дреговичей; кривичи — крупнейший союз племён; каждому союзу был присущ свой тип женских украшений. Кривичи жили на севере (Полоцк, Витебск), а не в среднем течении Припяти (там — дреговичи); древнейший город радимичей — Гомель.`},
  {id:"rt25", topic:"polotsk", part:"Б", type:"multi",
   q:"Определите три правильных утверждения относительно распространения христианства на белорусских землях в конце X — XIII в.:",
   o:["Отсутствовали епархии","Христианство было принято в качестве государственной религии","Активно строились церкви и монастыри","Сложилось двоеверие","Митрополит подчинялся папе римскому"], c:[1,2,3],
   e:`Верно: христианство стало государственной религией; строились церкви и монастыри; сложилось двоеверие. Епархии существовали (Полоцкая — ок. 992, Туровская — 1005); митрополит подчинялся Константинополю.`},
  {id:"rt26", topic:"vkl", part:"Б", type:"multi",
   q:"Определите три правильных утверждения относительно татар, проживавших в ВКЛ:",
   o:["Исповедовали иудаизм","Вели кочевой образ жизни","Приглашались в ВКЛ великими князьями литовскими","Строили для себя мечети","Исповедовали ислам"], c:[2,3,4],
   e:`Верно: татары приглашались в ВКЛ великими князьями, строили мечети, исповедовали ислам. Они переходили к оседлому образу жизни (не кочевому) и не исповедовали иудаизм.`},
  {id:"rt27", topic:"vkl", part:"Б", type:"multi",
   q:"Определите три характерные черты государственного строя ВКЛ в конце XIII — XIV в.:",
   o:["Княжество управлялось католической церковью","Княжество являлось монархией","Некоторые волости управлялись великокняжескими наместниками","Существовало вече в городах","Формировался общегосударственный (вальный) сейм"], c:[1,2,3],
   e:`Верно: ВКЛ было монархией; часть волостей управлялась наместниками; в городах существовало вече. Вальный сейм сформировался позже — в XV–XVI вв.; церковь не управляла княжеством.`},
  {id:"rt28", topic:"ri", part:"Б", type:"multi",
   q:"Определите три характерные черты социально-экономического положения белорусских земель во второй половине XIX в.:",
   o:["Создание коллективных хозяйств","Расположение предприятий преимущественно в сельской местности","Развитие отраслей промышленности, связанных с переработкой продуктов земледелия","Интенсивное строительство речных каналов","Строительство железных дорог"], c:[1,2,4],
   e:`Во второй половине XIX в. предприятия размещались преимущественно в сельской местности, развивалась переработка продуктов земледелия, строились железные дороги. Коллективные хозяйства — XX в.; каналы активно строили в конце XVIII — начале XIX в.`},
  {id:"rt29", topic:"bnr", part:"Б", type:"multi",

/* ===================================================================
   БЛОК 4. СОСТОЯНИЕ И ХРАНИЛИЩЕ
   =================================================================== */
const LS_KEY = "istoriyabel_state_v1";

const defaultState = {
  page: "home",
  theoryId: null,
  practiceTopic: null,
  practiceIndex: 0,
  practiceAnswers: [],
  practiceChecked: [],
  practiceQuestions: [],
  flashIndex: 0,
  flashFlipped: false,
  examActive: false,
  examQuestions: [],
  examAnswers: [],
  examIndex: 0,
  examStartTime: 0,
  examDuration: 30 * 60, // 30 минут в секундах
  examTimeLeft: 30 * 60,
  examFinished: false,
  examTimerId: null,
  stats: {                     // накопительная статистика
    totalAnswered: 0,
    totalCorrect: 0,
    byTopic: {}                // { topic: { answered, correct } }
  },
  history: []                  // история попыток [{date, mode, topic, correct, total}]
};

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    const merged = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
    // при загрузке обнуляем временное
    merged.examTimerId = null;
    return merged;
  } catch(e) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  try {
    const toSave = Object.assign({}, state);
    delete toSave.examTimerId;
    // не сохраняем сами вопросы, чтобы не раздувать localStorage
    toSave.practiceQuestions = [];
    toSave.examQuestions = [];
    localStorage.setItem(LS_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

/* ===================================================================
   БЛОК 5. РОУТИНГ И РЕНДЕР
   =================================================================== */
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', cur);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = cur === 'light' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', cur); } catch (e) {}
}
try {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    setTimeout(() => { const b = document.getElementById('themeToggle'); if (b) b.textContent = '☀️'; }, 50);
  }
} catch (e) {}

function showPage(page, opts = {}) {
  state.page = page;
  if (page === 'theory' && opts.theoryId === undefined) state.theoryId = null;
  if (opts.theoryId !== undefined) state.theoryId = opts.theoryId;
  if (opts.practiceTopic !== undefined) {
    state.practiceTopic = opts.practiceTopic;
    startPractice(opts.practiceTopic);
  }
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  saveState();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function startPractice(topic) {
  state.practiceQuestions = topic === "all"
    ? shuffle([...QUESTIONS])
    : shuffle(QUESTIONS.filter(q => q.topic === topic));
  state.practiceIndex = 0;
  state.practiceAnswers = new Array(state.practiceQuestions.length).fill(null);
  state.practiceChecked = new Array(state.practiceQuestions.length).fill(false);
}

function showPracticeMenu() {
  state.practiceTopic = null;
  state.practiceQuestions = [];
  state.practiceAnswers = [];
  state.practiceChecked = [];
  state.practiceIndex = 0;
  showPage('practice');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---- Проверка и отображение ответов: single | multi | match | order ---- */
function isCorrect(q, ans) {
  if (ans === null || ans === undefined) return false;
  const t = q.type || "single";
  if (t === "single") return ans === q.c;
  if (t === "multi") return Array.isArray(ans) && ans.length === q.c.length && q.c.every(i => ans.includes(i));
  if (t === "match" || t === "order") {
    return Array.isArray(ans) && ans.length === q.c.length && q.c.every((v, i) => v === ans[i]);
  }
  return false;
}

function formatUserAnswer(q, ans) {
  if (ans === null || ans === undefined) return "—";
  const t = q.type || "single";
  if (t === "single") return q.o[ans] !== undefined ? q.o[ans] : "—";
  if (t === "multi") return Array.isArray(ans) && ans.length ? ans.map(i => q.o[i]).join("; ") : "—";
  if (t === "match") return q.left.map((l, i) => `${i + 1}—${(ans[i] !== null && ans[i] !== undefined && q.right[ans[i]]) ? q.right[ans[i]].charAt(0) : "?"}`).join("; ");
  if (t === "order") return Array.isArray(ans) && ans.length ? ans.map(i => q.o[i]).join(" → ") : "—";
  return "—";
}

function formatCorrectAnswer(q) {
  const t = q.type || "single";
  if (t === "single") return q.o[q.c];
  if (t === "multi") return q.c.map(i => q.o[i]).join("; ");
  if (t === "match") return q.left.map((l, i) => `${i + 1}—${q.right[q.c[i]].charAt(0)}`).join("; ");
  if (t === "order") return q.c.map(i => q.o[i]).join(" → ");
  return "—";
}

function renderQuestionBody(q, ans, checked, mode) {
  const type = q.type || "single";
  if (type === "match") {
    const cur = Array.isArray(ans) && ans.length === q.left.length ? ans : new Array(q.left.length).fill(null);
    return `
      <div>
        ${q.left.map((l, li) => {
          let cls = "match-row";
          if (checked) cls += cur[li] === q.c[li] ? " ok" : " bad";
          return `<div class="${cls}">
            <div class="match-left">${l}</div>
            <select ${checked ? "disabled" : ""} onchange="${mode}SetMatch(${li}, this.value)">
              <option value="">— выберите —</option>
              ${q.right.map((r, ri) => `<option value="${ri}" ${cur[li] === ri ? "selected" : ""}>${r}</option>`).join("")}
            </select>
          </div>`;
        }).join("")}
      </div>`;
  }
  if (type === "order") {
    const cur = Array.isArray(ans) && ans.length === q.o.length ? ans : q.o.map((_, k) => k);
    return `
      <div>
        ${cur.map((oi, pos) => {
          let cls = "order-row";
          if (checked) cls += oi === q.c[pos] ? " ok" : " bad";
          return `<div class="${cls}">
            <div class="order-text">${q.o[oi]}</div>
            ${checked ? "" : `<button class="order-btn" onclick="${mode}MoveOrder(${pos}, -1)" ${pos === 0 ? "disabled" : ""} title="Выше">↑</button>
            <button class="order-btn" onclick="${mode}MoveOrder(${pos}, 1)" ${pos === cur.length - 1 ? "disabled" : ""} title="Ниже">↓</button>`}
          </div>`;
        }).join("")}
      </div>`;
  }
  const isMulti = type === "multi";
  const singleFn = mode === "practice" ? "answerPractice" : "answerExam";
  return `
    <div>
      ${q.o.map((opt, idx) => {
        let cls = "option";
        if (isMulti) {
          if (checked) {
            cls += " disabled";
            if (q.c.includes(idx)) cls += " correct";
            else if (Array.isArray(ans) && ans.includes(idx)) cls += " wrong";
          } else if (Array.isArray(ans) && ans.includes(idx)) {
            cls += " selected";
          }
        } else if (checked) {
          cls += " disabled";
          if (idx === q.c) cls += " correct";
          else if (idx === ans) cls += " wrong";
        } else if (idx === ans) {
          cls += " selected";
        }
        const handler = checked ? "" : ` onclick="${isMulti ? mode + "ToggleMulti" : singleFn}(${idx})"`;
        return `<button class="${cls}"${handler}>
          <span class="option-letter">${String.fromCharCode(1040 + idx)})</span>${opt}
        </button>`;
      }).join("")}
    </div>`;
}

function render() {
  const app = document.getElementById('app');
  switch (state.page) {
    case "home": app.innerHTML = renderHome(); break;
    case "theory": app.innerHTML = state.theoryId ? renderTheoryDetail() : renderTheoryList(); break;
    case "practice": app.innerHTML = (state.practiceTopic && Array.isArray(state.practiceQuestions) && state.practiceQuestions.length) ? renderPractice() : renderPracticeMenu(); break;

  }
}

      <td>${h.date}</td>
      <td>${h.mode}</td>
      <td>${h.topic || ''}</td>
      <td>${h.correct}/${h.total} (${Math.round(h.correct/h.total*100)}%)</td>
    </tr>`).join('');

  return `
    <div class="card">
      <h2>📊 Прогресс</h2>
      <div class="stats">
        <div class="stat"><div class="stat-val">${s.totalAnswered}</div><div class="stat-label">всего ответов</div></div>
        <div class="stat"><div class="stat-val">${s.totalCorrect}</div><div class="stat-label">правильных</div></div>
        <div class="stat"><div class="stat-val">${acc}%</div><div class="stat-label">точность</div></div>
        <div class="stat"><div class="stat-val">${state.history.length}</div><div class="stat-label">попыток</div></div>
      </div>

      <div class="section-title">По темам</div>
      <table>
        <tr><th>Тема</th><th>Отвечено</th><th>Правильно</th><th>%</th></tr>
        ${topicRows}
      </table>

      <div class="section-title">Последние попытки</div>
      ${state.history.length === 0 ? '<p class="empty">Пока нет попыток — пройди тест!</p>' : `
        <table>
          <tr><th>Дата</th><th>Режим</th><th>Тема</th><th>Результат</th></tr>
          ${history}
        </table>
      `}

      <div style="margin-top:20px;">
        <button class="btn btn-outline" onclick="resetStats()">🗑 Сбросить статистику</button>
      </div>
    </div>
  `;
}

/* ===================================================================
   БЛОК 6. ДЕЙСТВИЯ
   =================================================================== */

/* Practice */
function answerPractice(idx) {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if ((q.type || "single") !== "single") return;
  if (state.practiceChecked[i]) return;
  state.practiceAnswers[i] = idx;
  state.practiceChecked[i] = true;
  recordAnswer(q.topic, isCorrect(q, idx));
  saveState();
  render();
  if (i < state.practiceQuestions.length - 1) {
    setTimeout(() => {
      if (state.practiceChecked[state.practiceIndex] &&
          state.practiceIndex === i &&
          state.practiceIndex < state.practiceQuestions.length - 1) {
        state.practiceIndex++;
        saveState();
        render();
      }
    }, 1000);
  }
}

function practiceToggleMulti(idx) {
  const i = state.practiceIndex;
  if (state.practiceChecked[i]) return;
  let ans = Array.isArray(state.practiceAnswers[i]) ? [...state.practiceAnswers[i]] : [];
  const pos = ans.indexOf(idx);
  if (pos >= 0) ans.splice(pos, 1); else ans.push(idx);
  ans.sort((a, b) => a - b);
  state.practiceAnswers[i] = ans;
  saveState();
  render();
}

function practiceSetMatch(li, val) {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if (state.practiceChecked[i]) return;
  let ans = Array.isArray(state.practiceAnswers[i]) && state.practiceAnswers[i].length === q.left.length
    ? [...state.practiceAnswers[i]] : new Array(q.left.length).fill(null);
  ans[li] = val === "" ? null : parseInt(val, 10);
  state.practiceAnswers[i] = ans;
  saveState();
  render();
}

function practiceMoveOrder(pos, dir) {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if (state.practiceChecked[i]) return;
  let ans = Array.isArray(state.practiceAnswers[i]) && state.practiceAnswers[i].length === q.o.length
    ? [...state.practiceAnswers[i]] : q.o.map((_, k) => k);
  const np = pos + dir;
  if (np < 0 || np >= ans.length) return;
  const tmp = ans[pos]; ans[pos] = ans[np]; ans[np] = tmp;
  state.practiceAnswers[i] = ans;
  saveState();
  render();
}

function checkPracticeAnswer() {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if (state.practiceChecked[i]) return;
  state.practiceChecked[i] = true;
  recordAnswer(q.topic, isCorrect(q, state.practiceAnswers[i]));
  saveState();
  render();
}

function nextPractice() {
  if (state.practiceIndex < state.practiceQuestions.length - 1) {
    state.practiceIndex++;
  } else {
    // завершение — сохраним попытку
    const total = state.practiceQuestions.length;
    const correct = state.practiceQuestions.reduce((a, q, idx) => a + (isCorrect(q, state.practiceAnswers[idx]) ? 1 : 0), 0);
    logAttempt('practice', state.practiceTopic, correct, total);
  }
  saveState();
  render();
}

function prevPractice() {
  if (state.practiceIndex > 0) {
    state.practiceIndex--;
    saveState();
    render();
  }
}

/* Exam */
function startExam() {
  state.examActive = true;
  state.examFinished = false;
  state.examQuestions = shuffle([...QUESTIONS]).slice(0, 30);
  state.examAnswers = new Array(state.examQuestions.length).fill(null);
  state.examIndex = 0;
  state.examTimeLeft = state.examDuration;
  state.examTimerId = setInterval(examTick, 1000);
  saveState();
  render();
}

function examTick() {
  if (!state.examActive) return;
  state.examTimeLeft--;
  if (state.examTimeLeft <= 0) {
    clearInterval(state.examTimerId);
    state.examTimerId = null;
    finishExam(true);
    return;
  }
  // обновляем только таймер, чтобы не дёргать весь DOM
  const timerEl = document.querySelector('.timer');
  if (timerEl) {
    const m = Math.floor(state.examTimeLeft / 60);
    const s = state.examTimeLeft % 60;
    timerEl.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    timerEl.classList.toggle('danger', state.examTimeLeft < 60);
    timerEl.classList.toggle('warn', state.examTimeLeft >= 60 && state.examTimeLeft < 300);
  }
}

function answerExam(idx) {
  const q = state.examQuestions[state.examIndex];
  if ((q.type || "single") !== "single") return;
  state.examAnswers[state.examIndex] = idx;
  saveState();
  render();
}

function examToggleMulti(idx) {
  const i = state.examIndex;
  let ans = Array.isArray(state.examAnswers[i]) ? [...state.examAnswers[i]] : [];
  const pos = ans.indexOf(idx);
  if (pos >= 0) ans.splice(pos, 1); else ans.push(idx);
  ans.sort((a, b) => a - b);
  state.examAnswers[i] = ans;
  saveState();
  render();
}

function examSetMatch(li, val) {
  const i = state.examIndex;
  const q = state.examQuestions[i];
  let ans = Array.isArray(state.examAnswers[i]) && state.examAnswers[i].length === q.left.length
    ? [...state.examAnswers[i]] : new Array(q.left.length).fill(null);
  ans[li] = val === "" ? null : parseInt(val, 10);
  state.examAnswers[i] = ans;
  saveState();
  render();
}

function examMoveOrder(pos, dir) {
  const i = state.examIndex;
  const q = state.examQuestions[i];
  let ans = Array.isArray(state.examAnswers[i]) && state.examAnswers[i].length === q.o.length
    ? [...state.examAnswers[i]] : q.o.map((_, k) => k);
  const np = pos + dir;
  if (np < 0 || np >= ans.length) return;
  const tmp = ans[pos]; ans[pos] = ans[np]; ans[np] = tmp;
  state.examAnswers[i] = ans;
  saveState();
  render();
}

function gotoExamQ(idx) {
  state.examIndex = idx;
  saveState();
  render();
}

function nextExamQ() {
  if (state.examIndex < state.examQuestions.length - 1) {
    state.examIndex++;
    saveState();
    render();
  }
}

function prevExamQ() {
  if (state.examIndex > 0) {
    state.examIndex--;
    saveState();
    render();
  }
}

function finishExam(force = false) {
  if (state.examTimerId) clearInterval(state.examTimerId);
  state.examTimerId = null;
  state.examActive = false;
  state.examFinished = true;

  const total = state.examQuestions.length;
  const correct = state.examQuestions.reduce((a, q, idx) => a + (isCorrect(q, state.examAnswers[idx]) ? 1 : 0), 0);

  state.examQuestions.forEach((q, idx) => {
    if (state.examAnswers[idx] !== null) {
      recordAnswer(q.topic, isCorrect(q, state.examAnswers[idx]));
    }
  });
  logAttempt('exam', '', correct, total);
  saveState();
  render();
}

function abortExam() {
  if (state.examTimerId) clearInterval(state.examTimerId);
  state.examTimerId = null;
  state.examActive = false;
  state.examFinished = false;
  state.examQuestions = [];
  state.examAnswers = [];
  showPage('home');
}

function resetExam() {
  state.examActive = false;
  state.examFinished = false;
  state.examQuestions = [];
  state.examAnswers = [];
  state.examIndex = 0;
  state.examTimeLeft = state.examDuration;
  saveState();
  render();
}

/* Flash */
function flipFlash() { state.flashFlipped = !state.flashFlipped; render(); }
function nextFlash() { state.flashIndex = (state.flashIndex + 1) % DATES.length; state.flashFlipped = false; render(); }
function prevFlash() { state.flashIndex = (state.flashIndex - 1 + DATES.length) % DATES.length; state.flashFlipped = false; render(); }
function shuffleFlash() { state.flashIndex = Math.floor(Math.random() * DATES.length); state.flashFlipped = false; render(); }

/* Stats */
function recordAnswer(topic, isCorrect) {
  state.stats.totalAnswered++;
  if (isCorrect) state.stats.totalCorrect++;
  if (!state.stats.byTopic[topic]) state.stats.byTopic[topic] = {answered: 0, correct: 0};
  state.stats.byTopic[topic].answered++;
  if (isCorrect) state.stats.byTopic[topic].correct++;
}

function logAttempt(mode, topic, correct, total) {
  const d = new Date();
  const date = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  state.history.push({date, mode, topic, correct, total});
  if (state.history.length > 100) state.history = state.history.slice(-100);
}

function resetStats() {
  if (!confirm("Сбросить всю статистику и историю попыток?")) return;
  state.stats = { totalAnswered: 0, totalCorrect: 0, byTopic: {} };
  state.history = [];
  saveState();
  render();
}

/* ===================================================================
   БЛОК 7. СТАРТ
   =================================================================== */
document.querySelectorAll('#nav button').forEach(b => {
  b.classList.toggle('active', b.dataset.page === state.page);
});
render();
</script>

</body>
