<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИсторияБел — подготовка к ЦЭ/ЦТ по истории Беларуси</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f7fa; --card: #fff; --text: #1e293b; --muted: #64748b;
    --primary: #2563eb; --primary-dark: #1e40af; --green: #16a34a;
    --red: #dc2626; --amber: #d97706; --border: #e2e8f0; --accent: #f1f5f9;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    background: var(--primary); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 { font-size: 1.2rem; cursor: pointer; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    background: rgba(255,255,255,.15); color: #fff; border: none;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .88rem;
    transition: background .15s; font-family: inherit;
  }
  nav button:hover { background: rgba(255,255,255,.3); }
  nav button.active { background: #fff; color: var(--primary); font-weight: 600; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 22px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 16px;
  }
  h2 { font-size: 1.4rem; margin-bottom: 12px; }
  h3 { font-size: 1.1rem; margin: 16px 0 8px; color: var(--primary-dark); }
  p { margin-bottom: 10px; }
  ul, ol { padding-left: 22px; margin-bottom: 10px; }
  li { margin-bottom: 4px; }
  b { color: #0f172a; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .topic-card {
    background: var(--card); border-radius: 12px; padding: 16px;
    cursor: pointer; border-left: 4px solid var(--primary);
    box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: transform .15s, box-shadow .15s;
  }
  .topic-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .topic-card h3 { margin-top: 0; color: var(--text); font-size: 1.05rem; }
  .topic-card p { color: var(--muted); font-size: .9rem; margin: 0; }
  .topic-card .badge {
    display: inline-block; background: var(--accent); color: var(--primary);
    padding: 2px 8px; border-radius: 6px; font-size: .78rem; margin-top: 8px;
  }
  .btn {
    background: var(--primary); color: #fff; border: none; padding: 10px 18px;
    border-radius: 8px; cursor: pointer; font-size: .95rem; font-weight: 500;
    transition: background .15s; font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  .btn-outline:hover { background: var(--accent); color: var(--primary-dark); }
  .btn-green { background: var(--green); }
  .btn-green:hover { background: #15803d; }
  .btn-amber { background: var(--amber); }
  .btn-amber:hover { background: #b45309; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .option {
    display: block; width: 100%; text-align: left; padding: 12px 16px;
    margin-bottom: 8px; border: 2px solid var(--border); border-radius: 10px;
    background: var(--card); cursor: pointer; font-size: 1rem;
    transition: all .15s; font-family: inherit; color: var(--text);
  }
  .option:hover:not(.disabled) { border-color: var(--primary); background: var(--accent); }
  .option.correct { border-color: var(--green); background: #f0fdf4; }
  .option.wrong { border-color: var(--red); background: #fef2f2; }
  .option.disabled { cursor: default; }
  .option-letter { font-weight: 700; margin-right: 8px; color: var(--primary); }
  .progress-bar {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; margin-bottom: 16px;
  }
  .progress-fill { height: 100%; background: var(--primary); transition: width .3s; }
  .question-meta {
    display: flex; justify-content: space-between; font-size: .85rem;
    color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; gap: 6px;
  }
  .explanation {
    background: #eff6ff; border-left: 4px solid var(--primary);
    padding: 12px 16px; border-radius: 8px; margin-top: 12px; font-size: .92rem;
  }
  .flashcard {
    min-height: 220px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border-radius: 16px; padding: 32px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.08); text-align: center;
    font-size: 1.2rem; user-select: none; transition: transform .2s;
    border: 2px solid var(--border);
  }
  .flashcard:hover { transform: scale(1.02); }
  .flashcard.back { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: var(--primary-dark); font-weight: 600; border-color: var(--primary); }
  .result-item {
    padding: 12px 14px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid;
    font-size: .93rem;
  }
  .result-item.ok { border-color: var(--green); background: #f0fdf4; }
  .result-item.bad { border-color: var(--red); background: #fef2f2; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--accent); padding: 12px 18px; border-radius: 10px; flex: 1; min-width: 130px; }
  .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: .82rem; color: var(--muted); }
  .back-link { color: var(--primary); cursor: pointer; font-size: .9rem; margin-bottom: 12px; display: inline-block; }
  .back-link:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 24px; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .9rem; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--accent); font-weight: 600; }
  .timer {
    font-family: 'Courier New', monospace; font-size: 1.3rem; font-weight: 700;
    padding: 8px 16px; background: #1e293b; color: #4ade80; border-radius: 8px;
    display: inline-block; margin-bottom: 12px;
  }
  .timer.warn { color: #fbbf24; }
  .timer.danger { color: #f87171; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .q-navigator {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap: 6px; margin: 16px 0;
  }
  .q-nav-btn {
    padding: 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); cursor: pointer; font-size: .85rem;
    font-family: inherit; color: var(--text);
  }
  .q-nav-btn.answered { background: var(--primary); color: #fff; border-color: var(--primary); }
  .q-nav-btn.current { outline: 2px solid var(--amber); }
  .q-nav-btn.correct { background: var(--green); color: #fff; border-color: var(--green); }
  .q-nav-btn.wrong { background: var(--red); color: #fff; border-color: var(--red); }
  .section-title {
    font-size: 1.1rem; font-weight: 600; color: var(--primary-dark);
    margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--border);
  }
  .highlight-box {
    background: #fffbeb; border-left: 4px solid var(--amber);
    padding: 12px 16px; border-radius: 8px; margin: 12px 0;
  }
  .tip-box {
    background: #f0fdf4; border-left: 4px solid var(--green);
    padding: 12px 16px; border-radius: 8px; margin: 12px 0;
  }
  .option.selected { border-color: var(--primary); background: var(--accent); }
  .match-row, .order-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border: 2px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    background: var(--card);
  }
  .match-row.ok, .order-row.ok { border-color: var(--green); background: #f0fdf4; }
  .match-row.bad, .order-row.bad { border-color: var(--red); background: #fef2f2; }
  .match-left, .order-text { flex: 1; font-size: .95rem; }
  .match-row select {
    padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px;
    font-size: .95rem; font-family: inherit; background: var(--card);
    color: var(--text); cursor: pointer; max-width: 45%;
  }
  .order-btn {
    width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); cursor: pointer; font-size: 1rem; color: var(--text);
    font-family: inherit; flex-shrink: 0;
  }
  .order-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--primary); }
  .order-btn:disabled { opacity: .35; cursor: default; }
  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    header h1 { font-size: 1rem; }
    nav button { padding: 6px 10px; font-size: .8rem; }
    main { margin: 16px auto; }
    .card { padding: 16px; }
    h2 { font-size: 1.2rem; }
  }
</style>
</head>

      <h3>Синхронистический хронограф: Беларусь — Европа — Русь</h3>
      <p>Полоцкая земля развивалась в общем ритме средневековой Европы: христианизация, рост городов, борьба за торговые пути. Сопоставление дат — ключ к заданиям ЦЭ/ЦТ.</p>
      <div style="overflow-x:auto;">

        <tr><td>XI в.</td><td>Софийский собор в Полоцке — один из древнейших каменных храмов Руси</td><td>Романский стиль в архитектуре Европы; Клюнийская реформа</td><td>1037 — Софийский собор в Киеве; 1045–1050 — София Новгородская</td></tr>

      <h3>Терминологический аппарат (формулировки РИКЗ)</h3>
      <p><b>Общественно-политические понятия:</b></p>
      <ul>
        <li><b>Вече</b> — собрание горожан, решавшее важнейшие вопросы жизни города; в Полоцке вече приглашало и изгоняло князей, решало вопросы войны и мира.</li>
        <li><b>Князь</b> — глава княжества, военачальник и судья; в Полоцке его власть ограничивалась вечем.</li>
        <li><b>Дружина</b> — постоянное войско и ближайшее окружение князя.</li>
        <li><b>Бояре</b> — знатные люди, старшие дружинники, крупные землевладельцы.</li>
        <li><b>Удел</b> — часть земли (княжества), которой владел отдельный князь.</li>
        <li><b>Волость</b> — сельская территория, подчинённая городу.</li>
      </ul>
      <p><b>Социально-экономические понятия:</b></p>
      <ul>
        <li><b>Полюдье</b> — объезд князем с дружиной подвластных земель для сбора дани.</li>
        <li><b>Дань</b> — натуральный или денежный сбор с населения в пользу князя.</li>
        <li><b>Погост</b> — центр сельской общины, место сбора дани.</li>
        <li><b>Смерд</b> — свободный крестьянин-общинник.</li>
        <li><b>Закуп</b> — зависимый крестьянин, взявший у землевладельца ссуду («купу») и отрабатывающий долг.</li>
        <li><b>Холоп</b> — человек, полностью лишённый личной свободы.</li>
        <li><b>Челядь</b> — зависимые люди, слуги (в широком смысле — рабы).</li>
        <li><b>Изгой</b> — человек, утративший прежний социальный статус и связь со своей группой.</li>
        <li><b>Гость</b> — купец, ведший торговлю, в том числе международную.</li>
        <li><b>Волок</b> — участок суши между реками, по которому перетаскивали суда.</li>
      </ul>
      <p><b>Торговые пути:</b></p>
      <ul>
        <li><b>«Путь из варяг в греки»</b> — система речных путей из Балтийского моря в Чёрное.</li>
        <li><b>Двинский путь</b> — торговый путь по Западной Двине к Балтике — основа богатства Полоцка.</li>
      </ul>
      <p><b>Религиозно-культурные понятия:</b></p>

  {
    id:"po-b4", topic:"polotsk", part:"Б", type:"multi",
    q:`Работа с документом. Фрагмент «Повести временных лет»: «И послал Владимир к Рогволоду в Полоцк: „Хочу дочь твою взять себе в жёны“. Она же ответила: „Не хочу разути сына рабыни, но хочу за Ярополка“. И пришёл Владимир на Полоцк, и убил Рогволода и сыновей его, и дочь его взял в жёны». Выберите два верных утверждения:`,

    e:`Верно: события относятся к 980 г.; Рогволод погиб при захвате Полоцка. Неверно: Рогнеда стала женой Владимира (не Ярослава); Всеслав Чародей — правнук Рогнеды (её сын — Изяслав, сын Изяслава — Брячислав, сын Брячислава — Всеслав); согласие было вынужденным — после гибели отца и братьев. Пояснение: «разути» — обряд разувания жениха невестой; «сын рабыни» — намёк на происхождение Владимира (сын Малуши).`

  {f:"27 июля 1990 г.", b:"Декларация о суверенитете БССР"},
  {f:"25 августа 1991 г.", b:"Независимость Республики Беларусь"},
  {f:"8 декабря 1991 г.", b:"Беловежские соглашения"},
  {f:"15 марта 1994 г.", b:"Конституция Республики Беларусь"},
  {f:"8 декабря 1999 г.", b:"Договор о Союзном государстве РБ и РФ"}
];

/* ===================================================================
   БЛОК 4. СОСТОЯНИЕ И ХРАНИЛИЩЕ
   =================================================================== */
const LS_KEY = "istoriyabel_state_v1";

const defaultState = {
  page: "home",
  theoryId: null,
  practiceTopic: null,
  practiceIndex: 0,
  practiceAnswers: [],
  practiceChecked: [],
  practiceQuestions: [],
  flashIndex: 0,
  flashFlipped: false,
  examActive: false,
  examQuestions: [],
  examAnswers: [],
  examIndex: 0,
  examStartTime: 0,
  examDuration: 30 * 60, // 30 минут в секундах
  examTimeLeft: 30 * 60,
  examFinished: false,
  examTimerId: null,
  stats: {                     // накопительная статистика
    totalAnswered: 0,
    totalCorrect: 0,
    byTopic: {}                // { topic: { answered, correct } }
  },
  history: []                  // история попыток [{date, mode, topic, correct, total}]
};

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    const merged = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
    // при загрузке обнуляем временное
    merged.examTimerId = null;
    return merged;
  } catch(e) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  try {
    const toSave = Object.assign({}, state);
    delete toSave.examTimerId;
    // не сохраняем сами вопросы, чтобы не раздувать localStorage
    toSave.practiceQuestions = [];
    toSave.examQuestions = [];
    localStorage.setItem(LS_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

/* ===================================================================
   БЛОК 5. РОУТИНГ И РЕНДЕР
   =================================================================== */
function showPage(page, opts = {}) {
  state.page = page;
  if (opts.theoryId !== undefined) state.theoryId = opts.theoryId;
  if (opts.practiceTopic !== undefined) {
    state.practiceTopic = opts.practiceTopic;
    startPractice(opts.practiceTopic);
  }
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  saveState();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function startPractice(topic) {
  state.practiceQuestions = topic === "all"
    ? shuffle([...QUESTIONS])
    : shuffle(QUESTIONS.filter(q => q.topic === topic));
  state.practiceIndex = 0;
  state.practiceAnswers = new Array(state.practiceQuestions.length).fill(null);
  state.practiceChecked = new Array(state.practiceQuestions.length).fill(false);
}

function showPracticeMenu() {
  state.practiceTopic = null;
  state.practiceQuestions = [];
  state.practiceAnswers = [];
  state.practiceChecked = [];
  state.practiceIndex = 0;
  showPage('practice');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---- Проверка и отображение ответов: single | multi | match | order ---- */
function isCorrect(q, ans) {
  if (ans === null || ans === undefined) return false;
  const t = q.type || "single";
  if (t === "single") return ans === q.c;
  if (t === "multi") return Array.isArray(ans) && ans.length === q.c.length && q.c.every(i => ans.includes(i));
  if (t === "match" || t === "order") {
    return Array.isArray(ans) && ans.length === q.c.length && q.c.every((v, i) => v === ans[i]);
  }
  return false;
}

function formatUserAnswer(q, ans) {
  if (ans === null || ans === undefined) return "—";
  const t = q.type || "single";
  if (t === "single") return q.o[ans] !== undefined ? q.o[ans] : "—";
  if (t === "multi") return Array.isArray(ans) && ans.length ? ans.map(i => q.o[i]).join("; ") : "—";
  if (t === "match") return q.left.map((l, i) => `${i + 1}—${(ans[i] !== null && ans[i] !== undefined && q.right[ans[i]]) ? q.right[ans[i]].charAt(0) : "?"}`).join("; ");
  if (t === "order") return Array.isArray(ans) && ans.length ? ans.map(i => q.o[i]).join(" → ") : "—";
  return "—";
}

function formatCorrectAnswer(q) {
  const t = q.type || "single";
  if (t === "single") return q.o[q.c];
  if (t === "multi") return q.c.map(i => q.o[i]).join("; ");
  if (t === "match") return q.left.map((l, i) => `${i + 1}—${q.right[q.c[i]].charAt(0)}`).join("; ");
  if (t === "order") return q.c.map(i => q.o[i]).join(" → ");
  return "—";
}

function renderQuestionBody(q, ans, checked, mode) {
  const type = q.type || "single";
  if (type === "match") {
    const cur = Array.isArray(ans) && ans.length === q.left.length ? ans : new Array(q.left.length).fill(null);
    return `
      <div>
        ${q.left.map((l, li) => {
          let cls = "match-row";
          if (checked) cls += cur[li] === q.c[li] ? " ok" : " bad";
          return `<div class="${cls}">
            <div class="match-left">${l}</div>
            <select ${checked ? "disabled" : ""} onchange="${mode}SetMatch(${li}, this.value)">
              <option value="">— выберите —</option>
              ${q.right.map((r, ri) => `<option value="${ri}" ${cur[li] === ri ? "selected" : ""}>${r}</option>`).join("")}
            </select>
          </div>`;
        }).join("")}
      </div>`;
  }
  if (type === "order") {
    const cur = Array.isArray(ans) && ans.length === q.o.length ? ans : q.o.map((_, k) => k);
    return `
      <div>
        ${cur.map((oi, pos) => {
          let cls = "order-row";
          if (checked) cls += oi === q.c[pos] ? " ok" : " bad";
          return `<div class="${cls}">
            <div class="order-text">${q.o[oi]}</div>
            ${checked ? "" : `<button class="order-btn" onclick="${mode}MoveOrder(${pos}, -1)" ${pos === 0 ? "disabled" : ""} title="Выше">↑</button>
            <button class="order-btn" onclick="${mode}MoveOrder(${pos}, 1)" ${pos === cur.length - 1 ? "disabled" : ""} title="Ниже">↓</button>`}
          </div>`;
        }).join("")}
      </div>`;
  }
  const isMulti = type === "multi";
  const singleFn = mode === "practice" ? "answerPractice" : "answerExam";
  return `
    <div>
      ${q.o.map((opt, idx) => {
        let cls = "option";
        if (isMulti) {
          if (checked) {
            cls += " disabled";
            if (q.c.includes(idx)) cls += " correct";
            else if (Array.isArray(ans) && ans.includes(idx)) cls += " wrong";
          } else if (Array.isArray(ans) && ans.includes(idx)) {
            cls += " selected";
          }
        } else if (checked) {
          cls += " disabled";
          if (idx === q.c) cls += " correct";
          else if (idx === ans) cls += " wrong";
        } else if (idx === ans) {
          cls += " selected";
        }
        const handler = checked ? "" : ` onclick="${isMulti ? mode + "ToggleMulti" : singleFn}(${idx})"`;
        return `<button class="${cls}"${handler}>
          <span class="option-letter">${String.fromCharCode(1040 + idx)})</span>${opt}
        </button>`;
      }).join("")}
    </div>`;
}

function render() {
  const app = document.getElementById('app');
  switch (state.page) {
    case "home": app.innerHTML = renderHome(); break;
    case "theory": app.innerHTML = state.theoryId ? renderTheoryDetail() : renderTheoryList(); break;
    case "practice": app.innerHTML = (state.practiceTopic && Array.isArray(state.practiceQuestions) && state.practiceQuestions.length) ? renderPractice() : renderPracticeMenu(); break;
    case "exam": app.innerHTML = renderExam(); break;
    case "flash": app.innerHTML = renderFlash(); break;
    case "stats": app.innerHTML = renderStats(); break;
  }
}

/* ---------------- HOME ---------------- */
function renderHome() {
  const totalQ = QUESTIONS.length;
  const acc = state.stats.totalAnswered > 0
    ? Math.round(state.stats.totalCorrect / state.stats.totalAnswered * 100) : 0;
  return `
    <div class="card">
      <h2>👋 Добро пожаловать на ИсторияБел!</h2>

      <div class="stats">
        <div class="stat"><div class="stat-val">${THEORY.length}</div><div class="stat-label">разделов теории</div></div>

        <div class="stat"><div class="stat-val">${DATES.length}</div><div class="stat-label">карточек с датами</div></div>
        <div class="stat"><div class="stat-val">${acc}%</div><div class="stat-label">средняя точность</div></div>
      </div>
      <div class="grid">
        <div class="topic-card" onclick="showPage('theory')">
          <h3>📖 Теория</h3>
          <p>Конспекты по 8 разделам с ключевыми фактами, персоналиями и ловушками</p>
        </div>
        <div class="topic-card" onclick="showPage('practice')">
          <h3>✏️ Практика</h3>
          <p>Тесты по темам с объяснениями — как на реальном ЦЭ/ЦТ</p>
        </div>
        <div class="topic-card" onclick="showPage('exam')">
          <h3>⏱ Экзамен</h3>
          <p>30 вопросов · 30 минут · как на настоящем экзамене</p>
        </div>
        <div class="topic-card" onclick="showPage('flash')">
          <h3>🃏 Тренажёр дат</h3>
          <p>${DATES.length} флеш-карточек: дата → событие</p>
        </div>
        <div class="topic-card" onclick="showPage('stats')">
          <h3>📊 Прогресс</h3>
          <p>Статистика по темам и история попыток</p>
        </div>
        <div class="topic-card" onclick="showPage('practice',{practiceTopic:'all'})">
          <h3>🎯 Смешанный тест</h3>
          <p>Все ${totalQ} вопросов вперемешку</p>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>💡 Как готовиться эффективно</h3>
      <ol>
        <li><b>Раздел теории</b> → сразу <b>тест по нему</b>. Не переходи дальше, пока не получишь 80%+.</li>
        <li>Каждый день <b>10 минут тренажёра дат</b> — даты это фундамент.</li>
        <li>Раз в неделю — <b>режим «Экзамен»</b>: 30 вопросов / 30 минут.</li>
        <li>Разбирай каждую ошибку: не запоминай ответ, а запоминай <b>почему</b>.</li>
        <li>Веди «дневник ловушек»: какие похожие даты/события ты путаешь.</li>
      </ol>
      <div class="tip-box">
        <b>Совет:</b> в реальном ЦЭ по истории Беларуси большая часть вопросов — «кто/когда/что», поэтому автоматизм на датах и персоналиях решает половину успеха.
      </div>
    </div>
  `;
}

/* ---------------- THEORY ---------------- */
function renderTheoryList() {
  return `
    <div class="card">
      <h2>📖 Теория</h2>
      <p>8 разделов по хронологии:</p>
      <div class="grid">
        ${THEORY.map(t => {
          const count = QUESTIONS.filter(q => q.topic === t.id).length;
          const stat = state.stats.byTopic[t.id];
          const acc = stat && stat.answered > 0 ? Math.round(stat.correct / stat.answered * 100) + "%" : "—";
          return `
            <div class="topic-card" onclick="showPage('theory',{theoryId:'${t.id}'})">
              <h3>${t.title}</h3>
              <p>${t.summary}</p>
              <span class="badge">${count} вопр. · ${acc}</span>
            </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTheoryDetail() {
  const t = THEORY.find(x => x.id === state.theoryId);
  if (!t) return `<div class="card"><div class="empty">Раздел не найден</div></div>`;
  const relatedQs = QUESTIONS.filter(q => q.topic === t.id).length;
  return `
    <div class="card">
      <span class="back-link" onclick="showPage('theory')">← Все разделы</span>
      <h2>${t.title}</h2>
      <div>${t.content}</div>
      <div style="margin-top:20px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" onclick="showPage('practice',{practiceTopic:'${t.id}'})">
          📝 Пройти тест (${relatedQs} вопр.)
        </button>
        <button class="btn btn-outline" onclick="showPage('theory')">К списку</button>
      </div>
    </div>
  `;
}

/* ---------------- PRACTICE ---------------- */
function renderPracticeMenu() {
  const topics = [
    {id:"all", title:"🎯 Смешанный тест (все темы)", count: QUESTIONS.length},
    ...THEORY.map(t => ({
      id: t.id, title: t.title,
      count: QUESTIONS.filter(q => q.topic === t.id).length
    }))
  ];
  return `
    <div class="card">
      <h2>✏️ Практика</h2>
      <p>Выбери тему — вопросы идут вперемешку:</p>
      <div class="grid">
        ${topics.map(t => `
          <div class="topic-card" onclick="showPage('practice',{practiceTopic:'${t.id}'})">
            <h3>${t.title}</h3>
            <p>${t.count} вопросов</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderPractice() {
  const qs = state.practiceQuestions;
  if (!qs.length) return `<div class="card"><div class="empty">Вопросов пока нет</div></div>`;

  if (!Array.isArray(state.practiceChecked) || state.practiceChecked.length !== qs.length) {
    state.practiceChecked = qs.map((q, idx) => (q.type || "single") === "single" && state.practiceAnswers[idx] !== null);
  }
  const allAnswered = qs.every((q, idx) => state.practiceChecked[idx]);
  if (allAnswered) return renderPracticeResult();

  const i = state.practiceIndex;
  const q = qs[i];
  const ans = state.practiceAnswers[i];
  const checked = state.practiceChecked[i];
  const type = q.type || "single";
  const progress = ((i + 1) / qs.length) * 100;
  const topicTitle = state.practiceTopic === 'all' ? 'Смешанный' : (THEORY.find(t => t.id === state.practiceTopic)?.title || '');

  return `
    <div class="card">
      <span class="back-link" onclick="showPracticeMenu()">← К темам</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="question-meta">
        <span>Вопрос ${i + 1} из ${qs.length}</span>
        <span>${topicTitle}${q.part ? " · Часть " + q.part : ""}</span>
      </div>
      <h2 style="font-size:1.15rem; margin:12px 0 20px;">${q.q}</h2>
      ${renderQuestionBody(q, ans, checked, "practice")}
      ${!checked && type !== "single" ? `<div style="margin-top:14px;"><button class="btn btn-green" onclick="checkPracticeAnswer()">Проверить ответ</button></div>` : ""}
      ${checked && q.e ? `<div class="explanation">💡 ${q.e}</div>` : ''}
      <div style="margin-top:20px; display:flex; justify-content:space-between; gap:8px;">
        <button class="btn btn-outline" ${i === 0 ? 'disabled' : ''} onclick="prevPractice()">← Назад</button>
        <button class="btn" ${!checked ? 'disabled' : ''} onclick="nextPractice()">
          ${i === qs.length - 1 ? 'Завершить' : 'Далее →'}
        </button>
      </div>
    </div>
  `;
}

function renderPracticeResult() {
  const qs = state.practiceQuestions;
  const correct = qs.reduce((a, q, idx) => a + (isCorrect(q, state.practiceAnswers[idx]) ? 1 : 0), 0);
  const pct = Math.round(correct / qs.length * 100);
  const topicTitle = state.practiceTopic === 'all' ? 'Смешанный' : (THEORY.find(t => t.id === state.practiceTopic)?.title || '');
  return `
    <div class="card">
      <span class="back-link" onclick="showPracticeMenu()">← К темам</span>
      <h2>Результат: ${topicTitle}</h2>
      <div class="stats">
        <div class="stat"><div class="stat-val">${correct}/${qs.length}</div><div class="stat-label">правильно</div></div>
        <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-label">процент</div></div>
        <div class="stat"><div class="stat-val">${pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "📚"}</div>
            <div class="stat-label">${pct >= 80 ? "Отлично!" : pct >= 60 ? "Неплохо" : "Повтори теорию"}</div></div>
      </div>
      <h3>Разбор ответов</h3>
      ${qs.map((q, idx) => {
        const ans = state.practiceAnswers[idx];
        const ok = isCorrect(q, ans);
        return `
          <div class="result-item ${ok ? 'ok' : 'bad'}">
            <b>${idx + 1}. ${q.q}</b>
            <p style="margin:6px 0 0; font-size:.9rem;">
              ${ok ? '✅' : '❌'} Твой ответ: <b>${formatUserAnswer(q, ans)}</b>
              ${!ok ? ` · Правильно: <b>${formatCorrectAnswer(q)}</b>` : ''}
            </p>
            ${q.e ? `<p style="margin:4px 0 0; font-size:.85rem; color:#475569;">💡 ${q.e}</p>` : ''}
          </div>`;
      }).join('')}
      <div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" onclick="startPractice('${state.practiceTopic}'); render();">🔄 Пройти заново</button>
        <button class="btn btn-outline" onclick="showPracticeMenu()">К темам</button>
      </div>
    </div>
  `;
}

/* ---------------- EXAM ---------------- */
function renderExam() {
  if (!Array.isArray(state.examQuestions) || !state.examQuestions.length) {
    // вопросы экзамена не сохраняются между сессиями — после перезагрузки показываем стартовый экран
    state.examActive = false;
    state.examFinished = false;
  }
  if (state.examFinished) return renderExamResult();

  if (!state.examActive) {
    return `
      <div class="card">
        <h2>⏱ Экзамен</h2>
        <p>Режим, максимально приближенный к реальному ЦЭ/ЦТ:</p>
        <ul>
          <li><b>30 вопросов</b> из всей базы вперемешку</li>
          <li><b>30 минут</b> на выполнение</li>
          <li>Можно переключаться между вопросами через навигатор</li>
          <li>Результат — в конце, с разбором</li>
        </ul>
        <div class="tip-box">
          <b>Совет:</b> если не знаешь ответ — отметь наугад и иди дальше. В реальном ЦЭ нет времени долго думать.
        </div>
        <button class="btn btn-amber" style="font-size:1.05rem; padding:14px 24px; margin-top:12px;" onclick="startExam()">
          🚀 Начать экзамен
        </button>
      </div>
    `;
  }

  const i = state.examIndex;
  const q = state.examQuestions[i];
  const chosen = state.examAnswers[i];
  const answeredCount = state.examAnswers.filter(a => a !== null).length;
  const minutes = Math.floor(state.examTimeLeft / 60);
  const seconds = state.examTimeLeft % 60;
  const timerCls = state.examTimeLeft < 60 ? 'danger' : state.examTimeLeft < 300 ? 'warn' : '';

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px;">
        <div class="timer ${timerCls}">⏱ ${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}</div>
        <div style="font-size:.9rem; color:var(--muted);">Отвечено: ${answeredCount}/${state.examQuestions.length}</div>
      </div>

      <div class="q-navigator">
        ${state.examQuestions.map((_, idx) => {
          let cls = 'q-nav-btn';
          if (state.examAnswers[idx] !== null) cls += ' answered';
          if (idx === i) cls += ' current';
          return `<button class="${cls}" onclick="gotoExamQ(${idx})">${idx + 1}</button>`;
        }).join('')}
      </div>

      <h2 style="font-size:1.15rem; margin:20px 0;">Вопрос ${i + 1}. ${q.q}</h2>
      ${renderQuestionBody(q, chosen, false, "exam")}

      <div style="margin-top:20px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline" ${i === 0 ? 'disabled' : ''} onclick="prevExamQ()">← Назад</button>
        <div style="display:flex; gap:8px;">
          ${i < state.examQuestions.length - 1
            ? `<button class="btn" onclick="nextExamQ()">Далее →</button>`
            : `<button class="btn btn-green" onclick="finishExam()">Завершить</button>`}
          <button class="btn btn-outline" onclick="abortExam()">Прервать</button>
        </div>
      </div>
    </div>
  `;
}

function renderExamResult() {
  const qs = state.examQuestions;
  const correct = qs.reduce((a, q, idx) => a + (isCorrect(q, state.examAnswers[idx]) ? 1 : 0), 0);
  const pct = Math.round(correct / qs.length * 100);
  const unanswered = state.examAnswers.filter(a => a === null).length;
  return `
    <div class="card">
      <h2>Результат экзамена</h2>
      <div class="stats">
        <div class="stat"><div class="stat-val">${correct}/${qs.length}</div><div class="stat-label">правильно</div></div>
        <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-label">процент</div></div>
        <div class="stat"><div class="stat-val">${unanswered}</div><div class="stat-label">без ответа</div></div>
        <div class="stat"><div class="stat-val">${pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "📚"}</div>
            <div class="stat-label">${pct >= 80 ? "Отличный результат!" : pct >= 60 ? "Хорошо" : "Нужна практика"}</div></div>
      </div>
      <h3>Разбор ответов</h3>
      ${qs.map((q, idx) => {
        const ans = state.examAnswers[idx];
        const ok = isCorrect(q, ans);
        const status = ans === null ? '❓' : (ok ? '✅' : '❌');
        return `
          <div class="result-item ${ok ? 'ok' : 'bad'}">
            <b>${idx + 1}. ${q.q}</b>
            <p style="margin:6px 0 0; font-size:.9rem;">
              ${status} Твой ответ: <b>${formatUserAnswer(q, ans)}</b>
              ${!ok ? ` · Правильно: <b>${formatCorrectAnswer(q)}</b>` : ''}
            </p>
            ${q.e ? `<p style="margin:4px 0 0; font-size:.85rem; color:#475569;">💡 ${q.e}</p>` : ''}
          </div>`;
      }).join('')}
      <div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-amber" onclick="resetExam()">🔄 Новый экзамен</button>
        <button class="btn btn-outline" onclick="showPage('home')">На главную</button>
      </div>
    </div>
  `;
}

/* ---------------- FLASH ---------------- */
function renderFlash() {
  const list = DATES;
  const c = list[state.flashIndex] || list[0];
  return `
    <div class="card">
      <h2>🃏 Тренажёр дат</h2>
      <p>Нажми на карточку, чтобы перевернуть. Всего карточек: ${list.length}.</p>
      <div class="flashcard ${state.flashFlipped ? 'back' : ''}" onclick="flipFlash()">
        ${state.flashFlipped ? c.b : c.f}
      </div>
      <p style="text-align:center; margin:12px 0; color:var(--muted); font-size:.9rem;">
        ${state.flashIndex + 1} / ${list.length} · ${state.flashFlipped ? 'событие' : 'дата'}
      </p>
      <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="prevFlash()">← Пред.</button>
        <button class="btn btn-outline" onclick="shuffleFlash()">🔀 Перемешать</button>
        <button class="btn" onclick="nextFlash()">След. →</button>
      </div>
    </div>
  `;
}

/* ---------------- STATS ---------------- */
function renderStats() {
  const s = state.stats;
  const acc = s.totalAnswered > 0 ? Math.round(s.totalCorrect / s.totalAnswered * 100) : 0;
  const topicRows = THEORY.map(t => {
    const st = s.byTopic[t.id] || {answered: 0, correct: 0};
    const pct = st.answered > 0 ? Math.round(st.correct / st.answered * 100) : 0;
    return `
      <tr>
        <td>${t.title}</td>
        <td>${st.answered}</td>
        <td>${st.correct}</td>
        <td>${st.answered > 0 ? pct + '%' : '—'}</td>
      </tr>`;
  }).join('');

  const history = state.history.slice(-10).reverse().map(h => `
    <tr>
      <td>${h.date}</td>
      <td>${h.mode}</td>
      <td>${h.topic || ''}</td>
      <td>${h.correct}/${h.total} (${Math.round(h.correct/h.total*100)}%)</td>
    </tr>`).join('');

  return `
    <div class="card">
      <h2>📊 Прогресс</h2>
      <div class="stats">
        <div class="stat"><div class="stat-val">${s.totalAnswered}</div><div class="stat-label">всего ответов</div></div>
        <div class="stat"><div class="stat-val">${s.totalCorrect}</div><div class="stat-label">правильных</div></div>
        <div class="stat"><div class="stat-val">${acc}%</div><div class="stat-label">точность</div></div>
        <div class="stat"><div class="stat-val">${state.history.length}</div><div class="stat-label">попыток</div></div>
      </div>

      <div class="section-title">По темам</div>
      <table>
        <tr><th>Тема</th><th>Отвечено</th><th>Правильно</th><th>%</th></tr>
        ${topicRows}
      </table>

      <div class="section-title">Последние попытки</div>
      ${state.history.length === 0 ? '<p class="empty">Пока нет попыток — пройди тест!</p>' : `
        <table>
          <tr><th>Дата</th><th>Режим</th><th>Тема</th><th>Результат</th></tr>
          ${history}
        </table>
      `}

      <div style="margin-top:20px;">
        <button class="btn btn-outline" onclick="resetStats()">🗑 Сбросить статистику</button>
      </div>
    </div>
  `;
}

/* ===================================================================
   БЛОК 6. ДЕЙСТВИЯ
   =================================================================== */

/* Practice */
function answerPractice(idx) {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if ((q.type || "single") !== "single") return;
  if (state.practiceChecked[i]) return;
  state.practiceAnswers[i] = idx;
  state.practiceChecked[i] = true;
  recordAnswer(q.topic, isCorrect(q, idx));
  saveState();
  render();
  if (i < state.practiceQuestions.length - 1) {
    setTimeout(() => {
      if (state.practiceChecked[state.practiceIndex] &&
          state.practiceIndex === i &&
          state.practiceIndex < state.practiceQuestions.length - 1) {
        state.practiceIndex++;
        saveState();
        render();
      }
    }, 1000);
  }
}

function practiceToggleMulti(idx) {
  const i = state.practiceIndex;
  if (state.practiceChecked[i]) return;
  let ans = Array.isArray(state.practiceAnswers[i]) ? [...state.practiceAnswers[i]] : [];
  const pos = ans.indexOf(idx);
  if (pos >= 0) ans.splice(pos, 1); else ans.push(idx);
  ans.sort((a, b) => a - b);
  state.practiceAnswers[i] = ans;
  saveState();
  render();
}

function practiceSetMatch(li, val) {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if (state.practiceChecked[i]) return;
  let ans = Array.isArray(state.practiceAnswers[i]) && state.practiceAnswers[i].length === q.left.length
    ? [...state.practiceAnswers[i]] : new Array(q.left.length).fill(null);
  ans[li] = val === "" ? null : parseInt(val, 10);
  state.practiceAnswers[i] = ans;
  saveState();
  render();
}

function practiceMoveOrder(pos, dir) {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if (state.practiceChecked[i]) return;
  let ans = Array.isArray(state.practiceAnswers[i]) && state.practiceAnswers[i].length === q.o.length
    ? [...state.practiceAnswers[i]] : q.o.map((_, k) => k);
  const np = pos + dir;
  if (np < 0 || np >= ans.length) return;
  const tmp = ans[pos]; ans[pos] = ans[np]; ans[np] = tmp;
  state.practiceAnswers[i] = ans;
  saveState();
  render();
}

function checkPracticeAnswer() {
  const i = state.practiceIndex;
  const q = state.practiceQuestions[i];
  if (state.practiceChecked[i]) return;
  state.practiceChecked[i] = true;
  recordAnswer(q.topic, isCorrect(q, state.practiceAnswers[i]));
  saveState();
  render();
}

function nextPractice() {
  if (state.practiceIndex < state.practiceQuestions.length - 1) {
    state.practiceIndex++;
  } else {
    // завершение — сохраним попытку
    const total = state.practiceQuestions.length;
    const correct = state.practiceQuestions.reduce((a, q, idx) => a + (isCorrect(q, state.practiceAnswers[idx]) ? 1 : 0), 0);
    logAttempt('practice', state.practiceTopic, correct, total);
  }
  saveState();
  render();
}

function prevPractice() {
  if (state.practiceIndex > 0) {
    state.practiceIndex--;
    saveState();
    render();
  }
}

/* Exam */
function startExam() {
  state.examActive = true;
  state.examFinished = false;
  state.examQuestions = shuffle([...QUESTIONS]).slice(0, 30);
  state.examAnswers = new Array(state.examQuestions.length).fill(null);
  state.examIndex = 0;
  state.examTimeLeft = state.examDuration;
  state.examTimerId = setInterval(examTick, 1000);
  saveState();
  render();
}

function examTick() {
  if (!state.examActive) return;
  state.examTimeLeft--;
  if (state.examTimeLeft <= 0) {
    clearInterval(state.examTimerId);
    state.examTimerId = null;
    finishExam(true);
    return;
  }
  // обновляем только таймер, чтобы не дёргать весь DOM
  const timerEl = document.querySelector('.timer');
  if (timerEl) {
    const m = Math.floor(state.examTimeLeft / 60);
    const s = state.examTimeLeft % 60;
    timerEl.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    timerEl.classList.toggle('danger', state.examTimeLeft < 60);
    timerEl.classList.toggle('warn', state.examTimeLeft >= 60 && state.examTimeLeft < 300);
  }
}

function answerExam(idx) {
  const q = state.examQuestions[state.examIndex];
  if ((q.type || "single") !== "single") return;
  state.examAnswers[state.examIndex] = idx;
  saveState();
  render();
}

function examToggleMulti(idx) {
  const i = state.examIndex;
  let ans = Array.isArray(state.examAnswers[i]) ? [...state.examAnswers[i]] : [];
  const pos = ans.indexOf(idx);
  if (pos >= 0) ans.splice(pos, 1); else ans.push(idx);
  ans.sort((a, b) => a - b);
  state.examAnswers[i] = ans;
  saveState();
  render();
}

function examSetMatch(li, val) {
  const i = state.examIndex;
  const q = state.examQuestions[i];
  let ans = Array.isArray(state.examAnswers[i]) && state.examAnswers[i].length === q.left.length
    ? [...state.examAnswers[i]] : new Array(q.left.length).fill(null);
  ans[li] = val === "" ? null : parseInt(val, 10);
  state.examAnswers[i] = ans;
  saveState();
  render();
}

function examMoveOrder(pos, dir) {
  const i = state.examIndex;
  const q = state.examQuestions[i];
  let ans = Array.isArray(state.examAnswers[i]) && state.examAnswers[i].length === q.o.length
    ? [...state.examAnswers[i]] : q.o.map((_, k) => k);
  const np = pos + dir;
  if (np < 0 || np >= ans.length) return;
  const tmp = ans[pos]; ans[pos] = ans[np]; ans[np] = tmp;
  state.examAnswers[i] = ans;
  saveState();
  render();
}

function gotoExamQ(idx) {
  state.examIndex = idx;
  saveState();
  render();
}

function nextExamQ() {
  if (state.examIndex < state.examQuestions.length - 1) {
    state.examIndex++;
    saveState();
    render();
  }
}

function prevExamQ() {
  if (state.examIndex > 0) {
    state.examIndex--;
    saveState();
    render();
  }
}

function finishExam(force = false) {
  if (state.examTimerId) clearInterval(state.examTimerId);
  state.examTimerId = null;
  state.examActive = false;
  state.examFinished = true;

  const total = state.examQuestions.length;
  const correct = state.examQuestions.reduce((a, q, idx) => a + (isCorrect(q, state.examAnswers[idx]) ? 1 : 0), 0);

  state.examQuestions.forEach((q, idx) => {
    if (state.examAnswers[idx] !== null) {
      recordAnswer(q.topic, isCorrect(q, state.examAnswers[idx]));
    }
  });
  logAttempt('exam', '', correct, total);
  saveState();
  render();
}

function abortExam() {
  if (state.examTimerId) clearInterval(state.examTimerId);
  state.examTimerId = null;
  state.examActive = false;
  state.examFinished = false;
  state.examQuestions = [];
  state.examAnswers = [];
  showPage('home');
}

function resetExam() {
  state.examActive = false;
  state.examFinished = false;
  state.examQuestions = [];
  state.examAnswers = [];
  state.examIndex = 0;
  state.examTimeLeft = state.examDuration;
  saveState();
  render();
}

/* Flash */
function flipFlash() { state.flashFlipped = !state.flashFlipped; render(); }
function nextFlash() { state.flashIndex = (state.flashIndex + 1) % DATES.length; state.flashFlipped = false; render(); }
function prevFlash() { state.flashIndex = (state.flashIndex - 1 + DATES.length) % DATES.length; state.flashFlipped = false; render(); }
function shuffleFlash() { state.flashIndex = Math.floor(Math.random() * DATES.length); state.flashFlipped = false; render(); }

/* Stats */
function recordAnswer(topic, isCorrect) {
  state.stats.totalAnswered++;
  if (isCorrect) state.stats.totalCorrect++;
  if (!state.stats.byTopic[topic]) state.stats.byTopic[topic] = {answered: 0, correct: 0};
  state.stats.byTopic[topic].answered++;
  if (isCorrect) state.stats.byTopic[topic].correct++;
}

function logAttempt(mode, topic, correct, total) {
  const d = new Date();
  const date = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  state.history.push({date, mode, topic, correct, total});
  if (state.history.length > 100) state.history = state.history.slice(-100);
}

function resetStats() {
  if (!confirm("Сбросить всю статистику и историю попыток?")) return;
  state.stats = { totalAnswered: 0, totalCorrect: 0, byTopic: {} };
  state.history = [];
  saveState();
  render();
}

/* ===================================================================
   БЛОК 7. СТАРТ
   =================================================================== */
document.querySelectorAll('#nav button').forEach(b => {
  b.classList.toggle('active', b.dataset.page === state.page);
});
render();
</script>

</body>
</html>
